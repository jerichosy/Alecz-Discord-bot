name: Dependency CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked --all-extras --dev
      - run: uv pip check
      - run: uvx flake8 . --extend-exclude=.venv --select=E9,F63,F7,F82 --show-source
        continue-on-error: true
      - run: uv run python -m compileall -q main.py
      - run: docker build -t alecz-ci .
  gate:
    name: Dependency CI Gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
